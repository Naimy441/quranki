<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quranki pronunciation recorder</title><style>body{margin:0;font:16px system-ui;background:#f6f8f7;color:#18201c}main{max-width:700px;margin:auto;padding:24px}.row,.jump{display:flex;gap:10px;align-items:center;justify-content:space-between}.jump{justify-content:flex-start;margin:12px 0}.jump input{width:78px}.jump button,.nav button{white-space:nowrap}.muted{color:#68756e}input,button{font:inherit;border-radius:12px;border:1px solid #d7dfd9;padding:12px}input{box-sizing:border-box}#search{width:100%;margin:10px 0}button{background:#167a4c;color:#fff;border:0;font-weight:700;cursor:pointer}.card{padding:30px;background:#fff;border-radius:20px;text-align:center}.arabic{font:52px serif;direction:rtl}.record{width:100%;font-size:20px;padding:16px}.recording{background:#b8323d}.nav button{min-width:132px}audio{width:100%;margin-top:16px}kbd{background:#e8eeea;border-radius:5px;padding:2px 6px;font:12px ui-monospace}</style><main><div class="row"><strong id="progress">Loading…</strong><span id="size" class="muted"></span><button id="review">Review trimmed</button></div><input id="search" placeholder="Search Arabic, English, or ID"><form id="jump-card" class="jump"><label>Deck card <input id="card-number" type="number" min="1" placeholder="#"></label><button>Go</button><span class="muted"><kbd>G</kbd></span></form><form id="jump-level" class="jump"><label>Level <input id="level-number" type="number" min="1" placeholder="#"></label><label>Card <input id="level-card" type="number" min="1" placeholder="#"></label><button>Go</button><span class="muted"><kbd>L</kbd></span></form><section class="card"><div id="arabic" class="arabic"></div><h2 id="english"></h2><p id="meta" class="muted"></p><button id="record" class="record">Start recording <kbd>Space</kbd></button><p id="status" class="muted">Press Space to start, then Space again to stop and save.</p><audio id="playback" controls hidden></audio></section><div class="row nav"><button id="previous">← Previous</button><span class="muted"><kbd>←</kbd> <kbd>→</kbd> navigate</span><button id="next">Next →</button></div></main><script>
let all=[],words=[],index={},trimmedIds=new Set(),position=0,stream,recorder,chunks=[],recording=false,saving=false,reviewing=false;const $=id=>document.getElementById(id),fmt=n=>n<1024?`${n} B`:`${(n/1024).toFixed(1)} KB`;
function render(){const w=words[position];if(!w)return;localStorage.setItem('quranki-recorder-position',w.id);$('arabic').textContent=w.arabic;$('english').textContent=w.english;$('meta').textContent=`Deck card ${w.deckCard} · Level ${w.level}, card ${w.card} · ${w.id}`;$('progress').textContent=`${reviewing?'Review · ':''}${w.deckCard} / ${reviewing?words.length:all.length}${index[w.id]?' · recorded':''}`;const bytes=Object.values(index).reduce((n,x)=>n+x.bytes,0);$('size').textContent=bytes?`${fmt(bytes)} total`:'';const hasAudio=reviewing?trimmedIds.has(w.id):Boolean(index[w.id]);const audio=$('playback');audio.hidden=!hasAudio;if(hasAudio){audio.oncanplay=reviewing?()=>audio.play().catch(()=>{$('status').textContent='Press play to continue review.'}):null;audio.src=`${reviewing?'/recordings/trimmed/':'/recordings/'}${reviewing?w.id+'.webm':index[w.id].file}`;audio.load()}}
function move(delta){if(recording||saving)return;position=Math.min(Math.max(position+delta,0),words.length-1);render()}
function releaseMicrophone(){stream?.getTracks().forEach(track=>track.stop());stream=undefined;recorder=undefined}
async function start(){if(saving)return;stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});chunks=[];const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';recorder=new MediaRecorder(stream,{mimeType:type});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=()=>{releaseMicrophone();recording=false;$('status').textContent='Recording failed. Try again.'};recorder.onstop=async()=>{releaseMicrophone();await save()};recorder.start();recording=true;$('record').classList.add('recording');$('record').textContent='Stop and save  Space';$('status').textContent='Recording. Press Space when you finish.'}
function stop(){if(!recording)return;recording=false;saving=true;$('record').classList.remove('recording');$('record').textContent='Saving…';$('status').textContent='Finishing audio…';recorder?.stop()}
async function save(){const w=words[position],blob=new Blob(chunks,{type:'audio/webm'});chunks=[];if(!blob.size){saving=false;$('status').textContent='Nothing was recorded. Try again.';$('record').textContent='Start recording  Space';return}try{const response=await fetch(`/api/recordings?id=${encodeURIComponent(w.id)}`,{method:'POST',body:blob,headers:{'content-type':'audio/webm'}});if(!response.ok)throw new Error('Could not save this recording.');index[w.id]=await response.json();$('record').textContent='Start recording  Space';if(reviewing){trimmedIds.delete(w.id);const currentDeckCard=w.deckCard;words=all.filter(word=>trimmedIds.has(word.id));position=Math.max(0,words.findIndex(word=>word.deckCard>currentDeckCard));$('status').textContent='Replacement saved. Its trimmed copy was removed; rerun the trim script later.';render()}else{$('status').textContent='Saved. Moving to the next word…';render();setTimeout(()=>move(1),180)}}catch(error){$('status').textContent=error.message;$('record').textContent='Start recording  Space'}finally{saving=false}}
function jumpTo(predicate){if(recording||saving)return;const target=all.findIndex(predicate);if(target<0){$('status').textContent='That card was not found.';return}reviewing=false;$('review').textContent='Review trimmed';$('search').value='';words=all;position=target;render()}
function toggleReview(){if(recording||saving)return;if(reviewing){reviewing=false;words=all;position=Math.max(0,all.findIndex(w=>w.id===localStorage.getItem('quranki-recorder-position')));$('review').textContent='Review trimmed';$('status').textContent='Back to the full recording deck.';render();return}const current=words[position];words=all.filter(w=>trimmedIds.has(w.id));if(!words.length){$('status').textContent='No trimmed recordings found. Restart the recorder server after trimming.';return}reviewing=true;position=Math.max(0,words.findIndex(w=>w.deckCard>=current.deckCard));$('review').textContent='Stop review';$('status').textContent='Loading trimmed recording…';render();const audio=$('playback');audio.play().then(()=>{$('status').textContent='Reviewing trimmed recordings in original deck order.'}).catch(()=>{$('status').textContent='Trimmed audio is ready below — press play once to allow continuous review.'})}
$('playback').onended=()=>{if(!reviewing)return;if(position<words.length-1)move(1);else{$('status').textContent='Trimmed recording review complete.';$('review').textContent='Review trimmed';reviewing=false}};$('review').onclick=toggleReview;$('record').onclick=()=>recording?stop():start().catch(error=>$('status').textContent=error.message);$('next').onclick=()=>move(1);$('previous').onclick=()=>move(-1);$('search').oninput=e=>{const current=words[position];reviewing=false;$('review').textContent='Review trimmed';words=all.filter(w=>`${w.id} ${w.arabic} ${w.english}`.toLowerCase().includes(e.target.value.toLowerCase()));position=Math.max(0,words.findIndex(w=>w.id===current?.id));render()};$('jump-card').onsubmit=e=>{e.preventDefault();jumpTo(w=>w.deckCard===Number($('card-number').value))};$('jump-level').onsubmit=e=>{e.preventDefault();const level=Number($('level-number').value),card=Number($('level-card').value);jumpTo(w=>w.level===level&&w.card===card)};document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();recording?stop():start().catch(error=>$('status').textContent=error.message)}if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key.toLowerCase()==='g')$('card-number').focus();if(e.key.toLowerCase()==='l')$('level-number').focus()});Promise.all([fetch('/api/words').then(r=>r.json()),fetch('/api/index').then(r=>r.json()),fetch('/api/trimmed-ids').then(r=>r.json())]).then(([loadedWords,loadedIndex,loadedTrimmed])=>{all=words=loadedWords;index=loadedIndex;trimmedIds=new Set(loadedTrimmed);const saved=localStorage.getItem('quranki-recorder-position');const mostRecent=Object.entries(index).sort(([,a],[,b])=>b.recordedAt.localeCompare(a.recordedAt))[0]?.[0];const resume=all.findIndex(w=>w.id===(saved||mostRecent));position=Math.max(0,resume+(saved?0:1));render()});
</script>
